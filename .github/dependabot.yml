version: 2
updates:
  # The packages in requirements.txt and requirements-dev.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all the small updates, instead of one each
      pip-minor-and-patch:
        update-types: [minor, patch]

  # The `uses:` lines in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
