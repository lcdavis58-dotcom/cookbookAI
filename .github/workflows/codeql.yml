name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new kinds of problems CodeQL learns to find get checked
  # even when no code changed
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        # python: the app; actions: the workflow files themselves
        language: [python, actions]
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Start CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
