name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A "Run workflow" button in the Actions tab. A manual run's secret scan
  # covers the repo's whole history, not just the new commits.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x64, Linux ARM64 (the Pi's CPU) and Windows x64 (the GPU machine).
        # No Windows ARM: chromadb and pymupdf publish no Windows ARM wheels.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        # 3.11 is Raspberry Pi OS Bookworm's Python; 3.13 is what runs locally.
        python: ["3.11", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the unit tests, measuring coverage
        run: python -m coverage run -m unittest discover testing

      # One job is enough for the summary table and the HTML report
      - name: Write coverage to the job summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage html

      - name: Save the HTML coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

      # Fails if coverage drops below the floor; raise it as tests are added
      - name: Check coverage hasn't dropped
        run: python -m coverage report --fail-under=65

  repo-checks:
    name: forbidden files and secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists a pull request's commits
    steps:
      - name: Check out the code, with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail if a gitignored file is committed
        run: |
          files=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$files" ]; then
            echo "::error::These files are in .gitignore but committed:"
            echo "$files"
            exit 1
          fi

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: bandit (Python security lint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install bandit
        run: pip install -r requirements-dev.txt

      # Tests are left out: they use assert, which bandit flags everywhere
      - name: Scan the code
        run: bandit -r . -x ./testing

  # Branch protection requires a check named "test". Matrix jobs get names
  # like "unit tests (ubuntu-latest, Python 3.13)", so this one job reports
  # for all of them, and for every other job listed in needs.
  test:
    needs: [unit-tests, repo-checks, bandit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
